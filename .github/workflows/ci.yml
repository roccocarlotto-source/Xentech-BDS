name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci
      # binaries.prisma.sh (descarga del motor de Prisma) flaquea de forma
      # intermitente desde los runners de Actions -- reintenta antes de
      # fallar el job por un problema de red externo, no de código. Ver
      # CLAUDE.md.
      - name: prisma generate + typecheck (con reintentos)
        run: |
          for intento in 1 2 3; do
            rm -rf node_modules/.prisma
            if npm run prisma:generate && npm run typecheck; then
              exit 0
            fi
            echo "prisma:generate/typecheck falló (intento $intento/3), reintentando en 15s..."
            sleep 15
          done
          exit 1
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
