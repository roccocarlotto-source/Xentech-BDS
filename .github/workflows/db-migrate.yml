name: DB Migrate

# Workflow manual: aplica el schema de Prisma a la base de datos real
# (Supabase). Se corre a mano (workflow_dispatch) porque en este momento
# del proyecto todavia no versionamos migraciones (prisma/migrations/),
# usamos `prisma db push` para sincronizar el schema mientras el modelo
# de datos esta en una etapa temprana y puede cambiar seguido. El motivo
# de que esto corra en CI y no localmente: la descarga de los binarios
# del motor de Prisma (binaries.prisma.sh) esta bloqueada por politica
# de red tanto en el entorno cloud de Claude como en el dispositivo local
# de Rocco; en los runners de GitHub Actions no hay esa restriccion.
#
# Si el push falla, el job abre un issue con el log completo -- el
# endpoint de logs "en crudo" de la API de Actions redirige a un blob de
# Azure que tampoco es alcanzable desde ninguno de los dos entornos de
# arriba, asi que este es el mecanismo para poder diagnosticar el error
# real sin acceso a la UI de GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  db-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci
      # binaries.prisma.sh flaquea de forma intermitente desde los runners
      # de Actions (ver CLAUDE.md) -- reintenta antes de fallar el job.
      - name: prisma generate (con reintentos)
        run: |
          for intento in 1 2 3; do
            npm run prisma:generate && exit 0
            echo "prisma:generate falló (intento $intento/3), reintentando en 15s..."
            sleep 15
          done
          exit 1

      - name: prisma db push
        run: npx prisma db push 2>&1 | tee /tmp/db-push.log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Reportar error en un issue si falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "DB Migrate falló (run ${{ github.run_id }})" \
            --body-file /tmp/db-push.log
